server:
  port: 8080

spring:
  # Default profile for local runs. Override with SPRING_PROFILES_ACTIVE=prod in production.
  # Tests pin themselves to the H2-backed 'test' profile via @ActiveProfiles("test").
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Batch bulk inserts into one JDBC round trip (ADR-018/REQ-025). order_inserts groups
        # same-table statements so they actually batch; batch_size matches the ShortLink pooled
        # sequence allocationSize.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# Application configuration (see AppProperties). Prefixed with 'app'.
app:
  # Base URL used to build the returned short URL. Override per environment.
  base-url: http://localhost:8080
  # Hosts that must not be shortened (prevents redirect loops / self-host abuse, ADR-007/REQ-010).
  self-hosts:
    - localhost
    - 127.0.0.1
  rate-limit:
    # Per-IP fixed-window limit for POST /api/links (ADR-008/REQ-009).
    window-seconds: 60
    max-requests: 20

logging:
  level:
    com.example.tinyurl: INFO
