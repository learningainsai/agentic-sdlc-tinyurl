# Test profile — in-memory H2. Activated by @ActiveProfiles("test") on context-loading tests.
spring:
  datasource:
    url: jdbc:h2:mem:tinyurl;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # Expose Statistics so the bulk statement-count regression test can assert bounded round
        # trips (TEST-019/REQ-024).
        generate_statistics: true
