# Test profile — in-memory H2. Activated by @ActiveProfiles("test") on context-loading tests.
spring:
  datasource:
    url: jdbc:h2:mem:tinyurl;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
