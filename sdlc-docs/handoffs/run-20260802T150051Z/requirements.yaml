context_summary: >
  Phase 2 requirements for the TinyURL shortener approved by the human ("Accept all defaults", D1–D9).
  Two capabilities: (1) an optional nullable expiry (absolute UTC instant) on a short link, enforced
  lazily at redirect time — expired links return 404, past/now expiry at creation returns 400, expired
  aliases stay permanently reserved; and (2) bulk creation via a new POST /api/links/bulk endpoint that
  accepts a JSON array (1–100 items) of {url, alias?, expiresAt?}, applies best-effort partial success
  with per-item results, and consumes N per-IP rate-limit tokens. Ten new requirements
  (REQ-011..REQ-020) with testable acceptance criteria; a nullable expires_at column is the only schema
  change; UI adds an optional expiry picker (bulk is API-only). Likely impacts UNIT-001 (backend) and
  UNIT-002 (frontend). Next: architecture-design (high-impact — requires durable human confirmation).
