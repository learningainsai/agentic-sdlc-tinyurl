context_summary: >
  Phase 2 architecture approved by the user (durable record, critical_design). Seven ADRs
  (ADR-010..ADR-016): a nullable expires_at column with lazy read-time enforcement (expired => 404,
  no reaper, aliases permanently reserved); an optional absolute-UTC expiresAt on single create with
  past/now rejected as 400; a new POST /api/links/bulk endpoint (1-100 items, best-effort partial
  success, ordered per-item results) bounded to cap DoS; a shared RateLimiter with N-token bulk
  accounting (budget < N => whole-request 429); and an optional frontend expiry picker (bulk API-only).
  Only schema change is one nullable column. Branch => needs_decomposition (backend UNIT-001 +
  frontend UNIT-002 both affected). Next: unit-decomposition.
