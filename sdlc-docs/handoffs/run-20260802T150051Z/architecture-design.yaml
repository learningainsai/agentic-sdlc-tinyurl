decisions_made:
  - "ADR-010: nullable expires_at TIMESTAMP column; NULL = never expires; backward-compatible migration."
  - "ADR-011: lazy expiry in LinkService.resolve => expired returns 404; no reaper; rows retained."
  - "ADR-012: optional CreateLinkRequest.expiresAt (ISO-8601 UTC Instant); past/now => 400 via InvalidExpiryException."
  - "ADR-013: new POST /api/links/bulk (1-100 items); best-effort partial success; ordered per-item results."
  - "ADR-014: shared RateLimiter bean; bulk consumes N tokens; budget < N => whole request 429 (nothing created)."
  - "ADR-015: expired code/alias permanently reserved (uniqueness across all rows)."
  - "ADR-016: frontend optional expiry picker (datetime-local -> UTC ISO); bulk API-only in Phase 2."
