context_summary: >
  Implementation node complete for Phase 2. Backend UNIT-001 delivers the nullable expires_at column,
  lazy expiry on resolve (404), create-time expiry validation (400), and the bulk endpoint
  POST /api/links/bulk with best-effort per-item results and shared N-token rate limiting (429).
  Frontend UNIT-002 adds the optional expiry picker converting datetime-local to a UTC instant
  (ADR-016) and renders the created link's expiry. All tests green: backend 34 (31 unit/slice + 3 IT),
  frontend 9 specs; both builds succeed. High-impact construction was human-confirmed ('confirm').
  Next: testing and documentation nodes may run in parallel, then release-readiness (human go/no-go).
