decisions_made:
  - "ADR-010: nullable expires_at Instant column added to ShortLink (NULL = never expires); backward-compatible constructors retained."
  - "ADR-011/012: lazy expiry — LinkService.resolve throws CodeNotFoundException (404) when isExpired; Clock injected for testable boundaries; validateExpiry rejects <= now with InvalidExpiryException (400)."
  - "ADR-013: POST /api/links/bulk accepts 1-100 items; createBulk is deliberately NOT @Transactional so per-item failures are isolated (best-effort partial success) with ordered per-item BulkItemResult."
  - "ADR-014: shared RateLimiter bean with N-token tryAcquire; bulk rejected wholesale (429) when budget < item count, nothing created; single-create filter uses 1 token via RateLimitFilter."
  - "Slice-test fix: Clock and RateLimiter beans moved to WebConfig (@Configuration) so @WebMvcTest slices resolve without AppProperties leaking; TinyUrlApplication reverted."
  - "ADR-016: frontend converts datetime-local wall-clock to a UTC ISO instant via toUtcInstant before POST; bulk intentionally not exposed in the UI. link.service passes expiresAt through unchanged."
  - "Removed the orphaned Phase-1 withdrawn-scope 'deactivate' test rather than commenting it out; orphaned frontend spec expectations updated to the ADR-016 UTC-conversion contract (flagged to human)."
