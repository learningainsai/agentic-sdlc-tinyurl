context_summary: >
  Phase 2 decomposition approved. The expiry + bulk work maps onto the existing two units:
  UNIT-001 (backend, REQ-011..019 / ADR-010..015) covers the nullable expires_at column and migration,
  lazy read-time expiry (expired => 404), expiry validation (past/now => 400), the new POST
