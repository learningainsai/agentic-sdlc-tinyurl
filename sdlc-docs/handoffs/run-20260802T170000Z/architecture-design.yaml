context_summary: >
  Phase 3 architecture approved (critical_design, human 'Confirm'). The bulk-creation write path is
  redesigned as a two-pass algorithm behind the unchanged public contract: Pass 1 validates each item,
  assigns its code, and resolves uniqueness in memory using ONE consolidated existence query
  (findExistingCodes, ADR-019) plus an in-batch seen-set — invalid/duplicate items become per-item
  errors with identical error codes; Pass 2 persists the known-valid entities via saveAll under a
  single transaction so Hibernate JDBC batching applies (ADR-017). JDBC batching is enabled in
  application.yml (human-approved, REQ-025) and requires the ShortLink id strategy to move from
  IDENTITY to SEQUENCE, since IDENTITY disables insert batching (ADR-018). A transactional per-item
  fallback on the rare DataIntegrityViolationException preserves best-effort partial success under the
  Pass1->Pass2 race (ADR-021). Net: ~2N statements -> one existence query + ceil(N/batch_size) batched
  inserts, proven by a Hibernate Statistics regression test (REQ-024). Backend-only: impacts UNIT-001
  (LinkService, LinkRepository, ShortLink, application.yml); UNIT-002 untouched. Branch =>
  needs_decomposition (the only DAG-valid path, since implementation depends_on unit-decomposition and
  the mandatory plan node). Next: unit-decomposition (lightweight — reaffirm UNIT-001 scope for Phase 3).
