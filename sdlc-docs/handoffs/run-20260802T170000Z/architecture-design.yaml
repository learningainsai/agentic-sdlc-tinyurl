decisions_made:
  - "ADR-017: two-pass bulk algorithm — Pass 1 validate + assign codes + consolidated existence check in memory (invalid/duplicate items become per-item errors); Pass 2 saveAll under one transaction so JDBC batching applies. Preserves API contract (REQ-022) and best-effort partial success (REQ-023)."
  - "ADR-018: enable Hibernate JDBC batching in application.yml (batch_size:50, order_inserts) — HUMAN APPROVED (REQ-025). Requires ShortLink id strategy IDENTITY -> SEQUENCE (pooled) because IDENTITY disables insert batching in Hibernate."
  - "ADR-019: add LinkRepository.findExistingCodes(Collection<String>) — one parameterized SELECT ... WHERE code IN (:codes) replacing N per-item existsByCode SELECTs."
  - "ADR-020: in-memory generated-code assignment for no-alias items, checked against the consolidated existing-code set + in-batch seen-set, no per-item existence round trip."
  - "ADR-021: transactional per-item fallback on DataIntegrityViolationException (rare Pass1->Pass2 race) so every still-valid item persists — preserves REQ-023."
  - "High-impact critical_design durably approved by human (verbatim: 'Confirm')."
  - "Branch: needs_decomposition -> unit-decomposition (only DAG-valid path; implementation depends_on unit-decomposition AND plan). Backend-only: UNIT-001 impacted, UNIT-002 untouched."
