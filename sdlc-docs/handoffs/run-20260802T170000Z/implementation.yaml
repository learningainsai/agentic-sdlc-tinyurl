context_summary: >
  Phase 3 backend optimization implemented on UNIT-001 and verified green. createBulk is now a
  two-pass batched algorithm: it validates and assigns codes in memory (custom aliases plus generated
  codes kept unique within the batch), resolves all collisions with persisted rows via a single
  findExistingCodes SELECT (ADR-019), and inserts survivors with one batched saveAll; a per-item
  transactional fallback on DataIntegrityViolationException preserves best-effort partial success
  (ADR-021). ShortLink switched from IDENTITY to a pooled SEQUENCE (ADR-018) and application.yml
  enables Hibernate JDBC batching, so a 50-item batch now issues ≤10 prepared statements instead of
  ~100 (TEST-019). The response contract is byte-for-byte unchanged across all input classes
  (TEST-020) and the full existing suite stays green. One deploy caveat (RISK-023): prod schema must
  provide short_link_seq. Next: testing / documentation / code-review, then release-readiness.
