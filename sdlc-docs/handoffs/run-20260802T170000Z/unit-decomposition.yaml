context_summary: >
  Phase 3 decomposition: the bulk DB-query optimization is entirely backend and maps onto the
  existing UNIT-001 (REQ-021..025 / ADR-017..021). It covers the two-pass createBulk rewrite
  (in-memory validation + code assignment + a single consolidated findExistingCodes SELECT, then a
  batched saveAll), the ShortLink id-generation switch to SEQUENCE to unlock Hibernate insert
  batching, the application.yml batching settings (human-approved via REQ-025), and a transactional
  per-item fallback that preserves best-effort partial success. UNIT-002 (frontend) has no Phase 3
  work because the API contract is unchanged. Next: plan (mandatory before construction).
