context_summary: >
  Phase 3 requirements for the TinyURL shortener approved by the human ("Approve", accept defaults
  P1–P6). Single measurable objective: reduce the database round trips of bulk creation
  (POST /api/links/bulk) behind the unchanged public contract. Baseline measured from code:
  LinkService.createBulk loops item-by-item doing an individual existsByCode SELECT plus a
  non-batched INSERT (~2N statements for N items). Target: consolidate the existence checks and
  enable JDBC-batched inserts (human authorized editing application.yml for Hibernate batch settings —
  the one change AGENTS.md requires approval for). Five requirements REQ-021..REQ-025 with testable
  acceptance: reduced statement count proven via Hibernate Statistics (REQ-024); API contract and
  best-effort partial success preserved (REQ-022/023); no new library (REQ-025). Optimize for large
  batches (up to 100). PostgreSQL is the authoritative measurement target. Backend-only change —
  impacts UNIT-001 (LinkService.createBulk, LinkRepository, application.yml); UNIT-002 untouched.
  Next: architecture-design (high-impact — requires durable human confirmation) to resolve RISK-021
  (how batched inserts preserve best-effort partial success).
