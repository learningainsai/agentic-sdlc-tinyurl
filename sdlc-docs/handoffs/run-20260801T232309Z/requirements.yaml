context_summary: >
  Phase 1 MVP requirements for a TinyURL URL shortener approved by the user with all eight
  recommended defaults confirmed. Scope: shorten a URL with/without a custom alias, 302 redirect via
  short code, and an Angular submission UI, on a Spring Boot + PostgreSQL stack. Ten requirements
  (REQ-001..REQ-010) with testable acceptance criteria, plus security/perf NFRs (http/https only, max
  2048 chars, per-IP rate limiting, no SSRF, Base62 7-char codes, unique-constraint + retry). Out of
  scope: accounts, expiration/deletion, analytics, custom domains. Next: architecture-design
  (high-impact, requires durable confirmation).
