context_summary: >
  Architecture and design for the TinyURL MVP approved as a high-impact critical_design decision.
  Layered Spring Boot REST API (POST /api/links, GET /{code} -> 302) backed by a single short_link
  table in PostgreSQL/H2 with a unique code constraint; 7-char Base62 codes via SecureRandom with
  bounded retry; custom-alias validation (regex + reserved words, 409 on collision); http/https-only
  input with max length and self-host rejection and no server-side fetch (SSRF-safe); in-memory
  per-IP rate limiter (no new dependency); uniform ErrorResponse via @RestControllerAdvice. Angular
  standalone SPA submission form calling a LinkService. Nine ADRs trace to REQ-001..REQ-010. Branch
  decision (decompose vs single-unit) is pending human input before proceeding.
